[package]
name = "claude-manager"
version = "0.1.0"
edition = "2021"
description = "Manage Claude Code sessions (Windows + WSL) and run Claude in parallel terminal panes"
license = "MIT"
repository = "https://github.com/khoahotran/claude-manager"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "process", "io-util", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rayon = "1"
bincode = "1"
rust-embed = "8"
mime_guess = "2"
portable-pty = "0.9"
rand = "0.9"
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha1 = "0.10"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
similar = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
notify = { version = "8", default-features = false }

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
