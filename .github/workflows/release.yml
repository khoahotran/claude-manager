name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "claude-manager-${{ github.ref_name }}-windows-x64.exe"
          Copy-Item target/release/claude-manager.exe $name
          (Get-FileHash $name -Algorithm SHA256).Hash | Out-File sha256.txt
      # Upload as a draft and publish only after every asset is attached, so a cancelled or timed-out run
      # can never leave a public release with a partial set of files.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            claude-manager-${{ github.ref_name }}-windows-x64.exe
            sha256.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
